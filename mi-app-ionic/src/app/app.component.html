<ion-app>
  <ion-router-outlet></ion-router-outlet>
  <!-- Estado de conexión y sincronización: siempre visible en la parte inferior -->
  <div class="barra-estado" [ngClass]="estado()" (click)="tocarBarra()" role="status" aria-live="polite">
    <ion-icon [name]="icono()" [class.girando]="estado() === 'sincronizando'"></ion-icon>
    <span>{{ texto() }}</span>
  </div>
</ion-app>
